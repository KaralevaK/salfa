name: yellow-taxi-tests

on:
  push:
    branches: [main]
    paths:
      - "yellow_taxi_ws_ai/**"
      - ".github/workflows/yellow-taxi-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "yellow_taxi_ws_ai/**"
      - ".github/workflows/yellow-taxi-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: yellow_taxi_ws_ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yellow_taxi_ws_ai/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Existing checks (run_checks.py)
        run: python tests/run_checks.py

      - name: Forecast tests (pytest)
        run: python -m pytest tests/test_forecasting.py -v
